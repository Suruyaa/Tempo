<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>TEMPO Alert</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background: transparent;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 10px;
    }

    .alert-card {
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.96);
      border: 2px solid #ef4444;
      border-radius: 18px;
      box-shadow: 0 10px 40px rgba(239, 68, 68, 0.4), 0 0 20px rgba(239, 68, 68, 0.2);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      padding: 18px 20px;
      color: #f8fafc;
      animation: alertPulse 2s infinite ease-in-out;
      -webkit-app-region: drag;
      position: relative;
    }

    @keyframes alertPulse {
      0%, 100% {
        box-shadow: 0 10px 30px rgba(239, 68, 68, 0.3), 0 0 15px rgba(239, 68, 68, 0.2);
        border-color: #ef4444;
      }
      50% {
        box-shadow: 0 12px 45px rgba(239, 68, 68, 0.6), 0 0 30px rgba(239, 68, 68, 0.4);
        border-color: #f87171;
      }
    }

    .alert-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .badge-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-forced {
      background: #ef4444;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 4px 10px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .badge-horizon {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #0284c7;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .btn-sound-toggle {
      -webkit-app-region: no-drag;
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 14px;
    }

    .alert-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }

    .alert-title {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.3;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .alert-desc {
      font-size: 12px;
      color: #cbd5e1;
      line-height: 1.4;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .vault-preview {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .vault-chip {
      -webkit-app-region: no-drag;
      background: #1e293b;
      border: 1px solid #475569;
      color: #38bdf8;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
    }

    .vault-chip:hover {
      background: #0284c7;
      color: #ffffff;
    }

    .alert-actions {
      -webkit-app-region: no-drag;
      display: flex;
      gap: 8px;
      margin-top: auto;
    }

    .btn {
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-complete {
      flex: 2;
      background: #10b981;
      color: #ffffff;
    }
    .btn-complete:hover {
      background: #059669;
    }

    .btn-snooze {
      flex: 1.5;
      background: #334155;
      color: #f1f5f9;
      border: 1px solid #475569;
    }
    .btn-snooze:hover {
      background: #475569;
    }

    .btn-dismiss {
      flex: 1;
      background: transparent;
      color: #94a3b8;
      border: 1px solid #334155;
    }
    .btn-dismiss:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
    }

    /* Anti-Procrastination Gate Overlay */
    .procrastination-gate {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.98);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      padding: 20px;
      z-index: 50;
      -webkit-app-region: no-drag;
      animation: fadeIn 0.15s ease-out;
    }

    .procrastination-gate.hidden {
      display: none;
    }

    .gate-title {
      font-size: 14px;
      font-weight: 800;
      color: #ef4444;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .gate-desc {
      font-size: 12px;
      color: #cbd5e1;
      margin-bottom: 12px;
    }

    .gate-puzzle {
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      color: #38bdf8;
    }

    .gate-input {
      background: #0f172a;
      border: 1px solid #38bdf8;
      border-radius: 8px;
      padding: 8px 12px;
      color: #fff;
      font-size: 14px;
      width: 100%;
      text-align: center;
      outline: none;
      margin-bottom: 12px;
    }

    .gate-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }
  </style>
</head>
<body>
  <div class="alert-card">
    <div class="alert-header">
      <div class="badge-wrap">
        <span class="badge-forced">⚡ TEMPO ALERT</span>
        <span id="badgeHorizon" class="badge-horizon">H-1</span>
      </div>
      <button id="soundToggle" class="btn-sound-toggle" title="Matikan Bunyi">
        <svg id="soundIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
      </button>
    </div>

    <div class="alert-body">
      <div id="alertTitle" class="alert-title">Memuat agenda...</div>
      <div id="alertDesc" class="alert-desc">...</div>
      <div id="vaultList" class="vault-preview"></div>
    </div>

    <div class="alert-actions">
      <button id="btnComplete" class="btn btn-complete">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><polyline points="20 6 9 17 4 12"></polyline></svg>
        Selesai
      </button>
      <button id="btnSnooze" class="btn btn-snooze">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        Tunda 15m
      </button>
      <button id="btnDismiss" class="btn btn-dismiss">Tutup</button>
    </div>

    <!-- Anti-Procrastination Gate (Tantangan Pembatal Alarm) -->
    <div id="gateOverlay" class="procrastination-gate hidden">
      <div class="gate-title" style="display: flex; align-items: center; justify-content: center; gap: 6px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        TANTANGAN ANTI-MENUNDA
      </div>
      <p class="gate-desc">Tugas ini berprioritas tinggi! Selesaikan tantangan konfirmasi di bawah sebelum menunda/menutup alarm:</p>
      <div id="gatePuzzleText" class="gate-puzzle">Hitung: 15 + 18 = ?</div>
      <input type="text" id="gateInput" class="gate-input" placeholder="Ketik jawaban di sini..." autocomplete="off">
      <div class="gate-actions">
        <button id="btnGateCancel" class="btn btn-secondary" style="flex: 1;">Batal Tutup</button>
        <button id="btnGateConfirm" class="btn btn-primary" style="flex: 1; background: #ef4444;">Buka Kunci</button>
      </div>
    </div>
  </div>

  <script src="alert.js"></script>
</body>
</html>
