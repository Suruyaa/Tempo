<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>TEMPO Mini HUD</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background: transparent;
      overflow: hidden;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .widget-pill {
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 12px rgba(56, 189, 248, 0.15);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 12px;
      color: #f8fafc;
      -webkit-app-region: drag;
      cursor: grab;
      transition: all 0.2s;
    }

    .widget-pill:hover {
      border-color: #38bdf8;
      box-shadow: 0 8px 30px rgba(56, 189, 248, 0.3);
    }

    .widget-pill:active {
      cursor: grabbing;
    }

    .icon-tempo {
      font-size: 16px;
      background: rgba(56, 189, 248, 0.2);
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #38bdf8;
    }

    .widget-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      justify-content: center;
    }

    .widget-title {
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #f1f5f9;
    }

    .widget-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: #94a3b8;
    }

    .badge-time {
      color: #f59e0b;
      font-weight: 700;
    }

    .btn-open-main {
      -webkit-app-region: no-drag;
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .btn-open-main:hover {
      background: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="widget-pill">
    <div class="icon-tempo">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
      </svg>
    </div>
    <div class="widget-info">
      <div id="wTitle" class="widget-title">Memuat agenda...</div>
      <div class="widget-meta">
        <span id="wCountdown" class="badge-time">H-0</span>
        <span id="wProgress">0/0 selesai</span>
      </div>
    </div>
    <button id="btnOpen" class="btn-open-main" title="Buka Dashboard Penuh">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
        <polyline points="15 3 21 3 21 9"></polyline>
        <line x1="10" y1="14" x2="21" y2="3"></line>
      </svg>
    </button>
  </div>

  <script src="widget.js"></script>
</body>
</html>
