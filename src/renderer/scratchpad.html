<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>TEMPO Scratchpad</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background: transparent;
      overflow: hidden;
      padding: 10px;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scratchpad-card {
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 18px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.7), 0 0 24px rgba(56, 189, 248, 0.2);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      padding: 16px 20px;
      color: #f8fafc;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .scratchpad-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      -webkit-app-region: drag;
      cursor: grab;
      padding-bottom: 8px;
      border-bottom: 1px solid #334155;
    }

    .brand-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 0.5px;
    }

    .shortcut-badge {
      font-size: 10px;
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #475569;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    .btn-close {
      -webkit-app-region: no-drag;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .btn-close:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    .scratchpad-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      margin-bottom: 12px;
    }

    textarea {
      width: 100%;
      height: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px 14px;
      color: #f1f5f9;
      font-size: 14px;
      line-height: 1.5;
      resize: none;
      outline: none;
      font-family: inherit;
      user-select: text;
    }
    textarea:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
    }

    .scratchpad-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .save-indicator {
      font-size: 11px;
      color: #10b981;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .action-btns {
      display: flex;
      gap: 8px;
    }

    .btn {
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #3b82f6;
      color: #fff;
    }
    .btn-primary:hover {
      background: #2563eb;
    }

    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #475569;
    }
    .btn-secondary:hover {
      background: #334155;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="scratchpad-card">
    <div class="scratchpad-header">
      <div class="brand-pill" style="display: flex; align-items: center; gap: 8px;">
        <img src="assets/tempo-logo.png" alt="TEMPO" style="width: 15px; height: 15px; object-fit: contain;">
        <span>TEMPO Scratchpad</span>
        <span class="shortcut-badge">Alt + Space</span>
      </div>
      <button id="btnClose" class="btn-close" title="Tutup (Esc)">&times;</button>
    </div>

    <div class="scratchpad-body">
      <textarea id="noteInput" placeholder="Tempel catatan kilat, link, ide mendadak, atau daftar to-do di sini...&#10;&#10;Catatan otomatis tersimpan saat Anda mengetik!"></textarea>
    </div>

    <div class="scratchpad-actions">
      <div id="saveStatus" class="save-indicator">
        <span>●</span> Tersimpan otomatis
      </div>
      <div class="action-btns">
        <button id="btnCopy" class="btn btn-secondary" title="Salin ke Clipboard">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          Salin
        </button>
        <button id="btnConvertToLogbook" class="btn btn-secondary" title="Simpan sebagai Catatan Logbook Jurnal Hari Ini">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
          Ke Jurnal
        </button>
        <button id="btnConvertToAgenda" class="btn btn-primary" title="Jadikan Agenda Baru dengan Deadline Besok">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          Ke Agenda
        </button>
      </div>
    </div>
  </div>

  <script src="scratchpad.js"></script>
</body>
</html>
